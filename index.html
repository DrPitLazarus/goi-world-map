<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GOI World Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" type="text/css" media="screen" href="assets/style.css" />
    <script defer src="src/main.js" type="module"></script>
  </head>
  <body>
    <noscript><h1>JavaScript is disabled in your browser. Please enable it for this page to function.</h1></noscript>
    <div id="map"></div>
    <territory-bounds-painter>
      <label><input type="checkbox" class="leaflet-control-layers-selector" id="painter-checkbox" /> <span>Territory Bounds Painter</span></label>
      <section class="hidden">
        <label>Click to paint!</label>
        <label for="painter-dropdown">Paint Selection:</label>
        <paints></paints>
        <button id="paint-all">Paint All</button>
        <button id="randomize-all">Randomize All</button>
        <br>
        <button id="painter-reset">Paint Starting Defaults</button>
        <br>
        <button id="painter-latest-state">Paint Latest State</button>
      </section>
    </territory-bounds-painter>
    <alliance-config>
      <label>
        <input type="checkbox" class="leaflet-control-layers-selector" id="alliance-checkbox"/> <span>Alliance Config</span> <strong id="alliance-status"></strong>
      </label>
      <section class="hidden">
        <label for="alliance-1-color-dropdown">Alliance 1 Color:</label>
        <select id="alliance-1-color-dropdown"></select>
        <div id="alliance-1-factions"></div>
        <label for="alliance-2-color-dropdown">Alliance 2 Color:</label>
        <select id="alliance-2-color-dropdown"></select>
        <br>
        <button id="alliance-apply">Apply</button>
        <button id="alliance-remove">Remove</button>
      </section>
    </alliance-config>
    <history-viewer>
      <label>
        <input type="checkbox" class="leaflet-control-layers-selector" id="history-viewer-checkbox"/> <span>History Viewer</span>
      </label>
      <section class="hidden">
        <label>Select Dataset:<br>
          <select id="history-dataset-dropdown">
            <option value="2025-04-30">2025-04-30 War</option>
          </select>
        </label>
        <label>Select Snapshot:<br><select id="history-snapshot-dropdown"></select></label>
        <button id="history-load-previous-button">&lt; Previous</button>
        <button id="history-load-next-button">Next &gt;</button>
        <label>Press <kbd>,</kbd> for back and <kbd>.</kbd> for forward.</label>
      </section>
    </history-viewer>
  </body>
</html>
